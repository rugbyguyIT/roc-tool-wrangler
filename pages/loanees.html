<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Loanees · {{app}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
  <link rel="apple-touch-icon" href="/icons/icon.svg?v=2" />
  <meta name="theme-color" content="#002E5D" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="shell">
  <nav class="topnav">
    <div class="topnav-brand">
      <div class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <div class="brand-word"><b data-app-short>HLSR Assets</b><span>Loanees</span></div>
    </div>
    <div class="topnav-links"></div>
    <div class="topnav-user">
      <div class="avatar" id="user-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="user-meta">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role-label" id="user-role-label"></div>
      </div>
      <button class="btn btn-sm" onclick="signOut()" title="Sign out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Loanees</h1>
        <div class="small muted">The people who borrow equipment. They don't sign in —
          they're chosen at the counter.</div>
      </div>
      <div class="pill-row">
        <button class="btn btn-sm btn-primary" onclick="openRosterSync()"><i class="fa-solid fa-rotate"></i> Sync Roster</button>
        <button class="btn btn-sm" onclick="openImport('loanees')"><i class="fa-solid fa-file-import"></i> Import CSV / Excel</button>
        <button class="btn btn-sm btn-primary" onclick="newLoanee()"><i class="fa-solid fa-plus"></i> Add loanee</button>
      </div>
    </div>

    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <input class="form-input" id="ln-q" type="search" placeholder="Search name, email, committee, phone…" />
        </div>
        <div class="form-group">
          <select class="form-input" id="ln-group"><option value="">Any group</option></select>
        </div>
        <div class="form-group">
          <select class="form-input" onchange="setStatusFilter(this.value)">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div id="loanees-table"></div>
      <div id="ln-pager"></div>
    </div>
  </main>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/assets-ui.js"></script>
<script src="/js/csv.js"></script>
<script src="/js/importer.js"></script>
<script src="/js/roster-sync.js"></script>
<script src="/js/loanee-form.js"></script>
<script src="/js/loanees-page.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
