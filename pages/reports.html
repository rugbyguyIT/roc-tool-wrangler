<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reports · {{app}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
  <link rel="apple-touch-icon" href="/icons/icon.svg?v=2" />
  <meta name="theme-color" content="#002E5D" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="shell">
  <nav class="topnav">
    <div class="topnav-brand">
      <div class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <div class="brand-word"><b data-app-short>HLSR Assets</b><span>Reports</span></div>
    </div>
    <div class="topnav-links"></div>
    <div class="topnav-user">
      <div class="avatar" id="user-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="user-meta">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role-label" id="user-role-label"></div>
      </div>
      <button class="btn btn-sm" onclick="signOut()" title="Sign out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="content">
    <div class="topbar">
      <div>
        <div class="page-title">Reports</div>
        <div class="page-sub" id="page-sub">Who had what, and when</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="export-btn" onclick="doExport()">
          <i class="fa-solid fa-download"></i> Export CSV
        </button>
      </div>
    </div>

    <div class="main-panel">
      <div class="card card-sm" style="margin-bottom:16px">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="r-from">From</label>
            <input class="form-input" type="date" id="r-from" />
          </div>
          <div class="form-group">
            <label class="form-label" for="r-to">To</label>
            <input class="form-input" type="date" id="r-to" />
          </div>
        </div>
        <div class="pill-row">
          <button class="btn btn-sm" onclick="setRange('today')">Today</button>
          <button class="btn btn-sm" onclick="setRange('week')">Last 7 days</button>
          <button class="btn btn-sm" onclick="setRange('month')">Last 30 days</button>
          <button class="btn btn-sm" onclick="setRange('season')">Season to date</button>
          <button class="btn btn-sm" onclick="setRange('all')">All time</button>
        </div>
      </div>

      <div class="pill-row" style="margin-bottom:16px" id="report-tabs"></div>
      <div id="report-filters"></div>
      <div id="report-body"></div>
    </div>
    <footer class="site-footer">
      <span data-app-name>HLSR Asset Tracker</span> · <span data-app-org>Houston Livestock Show and Rodeo</span>
    </footer>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/assets-ui.js"></script>
<script src="/js/csv.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
