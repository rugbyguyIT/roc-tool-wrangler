<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Assets · {{app}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg?v=2" />
  <link rel="apple-touch-icon" href="/icons/icon.svg?v=2" />
  <meta name="theme-color" content="#002E5D" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="shell">
  <nav class="topnav">
    <div class="topnav-brand">
      <div class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></div>
      <div class="brand-word"><b data-app-short>HLSR Assets</b><span>Catalog</span></div>
    </div>
    <div class="topnav-links"></div>
    <div class="topnav-user">
      <div class="avatar" id="user-avatar"><i class="fa-solid fa-user"></i></div>
      <div class="user-meta">
        <div class="user-name" id="user-name">Loading…</div>
        <div class="user-role-label" id="user-role-label"></div>
      </div>
      <button class="btn btn-sm" onclick="signOut()" title="Sign out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <div class="content">
    <div class="topbar">
      <div>
        <div class="page-title">Assets</div>
        <div class="page-sub" id="page-sub">Loading…</div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div class="main-panel">
      <div class="bento-grid">
        <div class="bento-4">
          <div class="card card-sm">
            <div class="section-title"><i class="fa-solid fa-filter"></i> Filter</div>
            <div class="form-group">
              <label class="form-label" for="f-q">Search</label>
              <input class="form-input" id="f-q" type="search" placeholder="Tag, title, serial…" />
            </div>
            <div class="form-group">
              <label class="form-label" for="f-status">Status</label>
              <select class="form-input" id="f-status">
                <option value="">Any status</option>
                <option value="available">Available</option>
                <option value="checked_out">Checked out</option>
                <option value="maintenance">Maintenance</option>
                <option value="retired">Retired</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-category">Category</label>
              <select class="form-input" id="f-category"><option value="">Any category</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-location">Location</label>
              <select class="form-input" id="f-location"><option value="">Any location</option></select>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-group">Restriction</label>
              <select class="form-input" id="f-group">
                <option value="">Any</option>
                <option value="__none">Unrestricted only</option>
                <option value="__any">Restricted only</option>
              </select>
            </div>
            <button class="btn btn-block" onclick="clearFilters()">
              <i class="fa-solid fa-arrow-rotate-left"></i> Clear filters
            </button>
          </div>
        </div>

        <div class="bento-8">
          <div id="results"></div>
        </div>
      </div>
    </div>
    <footer class="site-footer">
      <span data-app-name>HLSR Asset Tracker</span> · <span data-app-org>Houston Livestock Show and Rodeo</span>
    </footer>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/assets-ui.js"></script>
<script src="/js/repairs.js"></script>
<script src="/js/assets.js"></script>
</body>
</html>
