<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sign In · {{app}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/brand.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=3" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
  <meta name="theme-color" content="#002E5D" />
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-shell">
    <!-- The badge is not circular, so it gets its own presentation rather
         than being cropped into the old orb. Shadow is cast down and to
         the right, as if lit from the upper left. -->
    <div class="auth-logo">
      <img class="auth-logo-img" src="/login-logo.png"
           alt="ROC Tool Wrangler"
           onerror="this.style.display='none';document.getElementById('auth-logo-fallback').style.display='flex'" />
      <div id="auth-logo-fallback" style="display:none;align-items:center;justify-content:center;height:120px">
        <i class="fa-solid fa-screwdriver-wrench" style="font-size:44px;color:#f5a623"></i>
      </div>
    </div>

    <div class="auth-card">
      <div id="login-error" class="auth-error" style="display:none"></div>

      <!-- Why you are here, when you did not ask to be. Filled by
           showEndedNote() in js/auth.js from the ?ended= reason. Calm on
           purpose: this is the app working, not an error, and the red
           .auth-error treatment above would say the opposite. Left-aligned
           because it is two sentences of prose in a centred card. -->
      <div id="login-note" style="display:none;margin-bottom:18px;padding:11px 14px;border-radius:10px;
           background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
           color:rgba(255,255,255,0.72);font-size:var(--fs-sm);line-height:1.55;text-align:left"></div>

      <div class="auth-eyebrow" data-app-org>Houston Livestock Show and Rodeo™</div>
      <h1 class="auth-heading" style="margin-bottom:8px">
        <span class="auth-heading-accent">Sign in.</span>
      </h1>
      <div class="auth-sub" style="margin-bottom:24px">
        Tool, cart and equipment check-out. Committee members sign in with their
        name and zip code.
      </div>

      <form onsubmit="handleLogin(event)" autocomplete="on">
        <!-- ONE box, not two, and deliberately type="text" rather than
             type="email" — a committee member types their name here and
             the browser would refuse to submit it as an email. Which kind
             of account you have is the app's problem, not yours. -->
        <label class="auth-field-label" for="email">Your name or email address</label>
        <input class="auth-input" type="text" id="email" name="email"
               placeholder="Bob Smith" required autocomplete="username"
               autocapitalize="words" spellcheck="false" />

        <!-- Only shown when the box above was filled in from last time. On
             the shared counter tablet that is the previous person's name,
             and being rid of it should be one tap, not a select-all.

             A <button>, not a link: it performs an action and goes
             nowhere. It borrows .auth-link for colour and hover, and
             carries its own layout inline — it tucks up under the
             right-hand end of the name field, taking back that field's
             own 18px so it reads as attached to the name above rather
             than as a heading for the box below. The 34px block keeps it
             a thumb-sized target on a tablet without looking like one. -->
        <button type="button" class="auth-link" id="not-you" onclick="clearIdentity()"
                style="display:none;margin:-14px 0 12px auto;padding:6px 2px;min-height:34px;
                       background:none;border:0;font-family:inherit;text-align:right">Not you?</button>

        <!-- The wording here is set by js/auth.js, not fixed in the markup:
             a committee member's password IS their zip code, so the label
             says "Zip code" the moment they type a name instead of an
             address. inputmode is left to the same code for the same
             reason — five digits want a numeric keypad, a passphrase does
             not, and this one box takes both. -->
        <label class="auth-field-label" for="password" id="password-label">Password</label>
        <div class="auth-pw-wrap">
          <input class="auth-input auth-input-pw" type="password" id="password" name="password"
                 placeholder="••••••••••" required autocomplete="current-password" />
          <button type="button" class="auth-pw-toggle" onclick="togglePw()" aria-label="Show password">
            <i class="fa-solid fa-eye" id="pw-icon"></i>
          </button>
        </div>

        <button type="submit" class="auth-btn" id="login-btn">
          <span id="login-btn-label">Sign In</span><i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="auth-copyright">
        <span data-app-name>HLSR Asset Tracker</span> ·
        <span id="cr-year"></span> <span data-app-org>Houston Livestock Show and Rodeo™</span>
      </div>
    </div>
  </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>document.getElementById('cr-year').textContent = new Date().getFullYear();</script>
</body>
</html>
